<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>HITTY Scantest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    #overlay {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 24px 24px 60px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, transparent);
    }
    #status { color: #39FF14; font-size: 15px; margin-bottom: 16px; text-align: center; }
    #result {
      width: 100%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
      padding: 16px; font-size: 13px; line-height: 1.8; word-break: break-all;
    }
    .label { color: rgba(255,255,255,0.35); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .value { color: #fff; font-weight: bold; }
    .track { color: #00E5FF; font-weight: bold; }
    canvas { position: fixed; top: -9999px; left: -9999px; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="overlay">
  <div id="status">Startet…</div>
  <div id="result">
    <div class="label">Methode</div>
    <div class="value" id="method">–</div>
    <div class="label" style="margin-top:8px">Erkannter Text</div>
    <div class="value" id="raw">–</div>
    <div class="label" style="margin-top:8px">Track-ID</div>
    <div class="track" id="trackid">–</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const methodEl = document.getElementById('method');
const rawEl    = document.getElementById('raw');
const tidEl    = document.getElementById('trackid');

// Kamera starten – genau gleich wie vorher (v1 hat funktioniert)
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
  .then(stream => {
    video.srcObject = stream;
    video.play();
    statusEl.textContent = 'Kamera aktiv – initialisiere Scanner…';
    initScanner();
  })
  .catch(e => {
    statusEl.textContent = '❌ Kamera: ' + e.name + ' – ' + e.message;
  });

function initScanner() {
  // Methode 1: BarcodeDetector (in Chrome Android eingebaut)
  if ('BarcodeDetector' in window) {
    methodEl.textContent = 'BarcodeDetector (nativ, kein CDN)';
    statusEl.textContent = '🟢 Bereit – QR-Code hinhalten';
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    setInterval(async () => {
      if (video.readyState < 4) return;
      try {
        const results = await detector.detect(video);
        if (results.length > 0) showResult(results[0].rawValue);
      } catch(e) { /* frame skip */ }
    }, 200);
    return;
  }

  // Methode 2: jsQR (CDN)
  if (typeof jsQR !== 'undefined') {
    methodEl.textContent = 'jsQR (CDN)';
    statusEl.textContent = '🟡 jsQR aktiv – QR-Code hinhalten';
    setInterval(() => {
      if (video.readyState < 4 || !video.videoWidth) return;
      if (!canvas.width) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img  = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
      if (code && code.data) showResult(code.data);
    }, 150);
    return;
  }

  // Weder noch
  methodEl.textContent = 'Kein Scanner verfügbar';
  statusEl.textContent = '❌ BarcodeDetector nicht verfügbar, jsQR nicht geladen';
}

function showResult(raw) {
  rawEl.textContent  = raw;
  tidEl.textContent  = extractTrackId(raw) || '– (kein HITTY-Format)';
  statusEl.textContent = '✅ QR erkannt!';
}

function extractTrackId(raw) {
  const m1 = raw.match(/[?&]t=([A-Za-z0-9]+)/);  if (m1) return m1[1];
  const m2 = raw.match(/spotify:track:([A-Za-z0-9]+)/); if (m2) return m2[1];
  if (/^[A-Za-z0-9]{22}$/.test(raw.trim())) return raw.trim();
  return null;
}
</script>
</body>
</html>
