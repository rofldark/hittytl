<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>HITTY Scantest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    #overlay {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 24px 24px 48px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, transparent);
    }
    #status {
      color: #39FF14;
      font-size: 13px;
      margin-bottom: 12px;
      text-align: center;
      min-height: 20px;
    }
    #result {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.7;
      word-break: break-all;
    }
    .label { color: rgba(255,255,255,0.35); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .value { color: #fff; font-weight: bold; margin-bottom: 10px; }
    .track { color: #00E5FF; font-weight: bold; }
    #frame-count { color: rgba(255,255,255,0.25); font-size: 11px; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="overlay">
  <div id="status">Startet…</div>
  <div id="result">
    <div class="label">Rohdaten</div>
    <div class="value" id="raw">–</div>
    <div class="label">Track-ID</div>
    <div class="track" id="trackid">–</div>
    <div class="label">Methode</div>
    <div class="value" id="method">–</div>
  </div>
  <div id="frame-count">Frame: 0</div>
</div>

<script>
const video    = document.getElementById('video');
const status   = document.getElementById('status');
const rawEl    = document.getElementById('raw');
const tidEl    = document.getElementById('trackid');
const methodEl = document.getElementById('method');
const fcEl     = document.getElementById('frame-count');

let frames = 0;
let detector = null;

// ── Kamera starten ──────────────────────────────────────────────
navigator.mediaDevices.getUserMedia({
  video: { facingMode: { ideal: 'environment' } },
  audio: false
})
.then(stream => {
  video.srcObject = stream;
  video.play();
  video.addEventListener('loadedmetadata', () => {
    status.textContent = `Kamera: ${video.videoWidth}×${video.videoHeight}`;
    startScanning();
  });
})
.catch(e => {
  status.textContent = '❌ Kamera-Fehler: ' + e.message;
});

// ── Scanner-Strategie wählen ────────────────────────────────────
async function startScanning() {
  // Strategie 1: BarcodeDetector API (Chrome Android, kein CDN nötig)
  if ('BarcodeDetector' in window) {
    try {
      detector = new BarcodeDetector({ formats: ['qr_code'] });
      methodEl.textContent = 'BarcodeDetector API (nativ)';
      status.textContent = '🟢 Nativ-Scanner aktiv – halte QR-Code vor die Kamera';
      scanWithBarcodeDetector();
      return;
    } catch(e) {
      // fallthrough
    }
  }

  // Strategie 2: jsQR via CDN
  methodEl.textContent = 'jsQR (CDN lädt…)';
  status.textContent = 'Lade jsQR…';
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js')
    .then(() => {
      methodEl.textContent = 'jsQR 1.4.0 (CDN)';
      status.textContent = '🟢 jsQR aktiv – halte QR-Code vor die Kamera';
      scanWithJsQR();
    })
    .catch(() => {
      status.textContent = '❌ jsQR konnte nicht geladen werden. BarcodeDetector auch nicht verfügbar.';
      methodEl.textContent = 'Kein Scanner verfügbar';
    });
}

// ── BarcodeDetector ─────────────────────────────────────────────
async function scanWithBarcodeDetector() {
  while (true) {
    await new Promise(r => setTimeout(r, 200));
    frames++;
    fcEl.textContent = `Frame: ${frames}`;
    try {
      const results = await detector.detect(video);
      if (results.length > 0) {
        const raw = results[0].rawValue;
        showResult(raw);
      }
    } catch(e) {
      // ignore frame errors
    }
  }
}

// ── jsQR ────────────────────────────────────────────────────────
function scanWithJsQR() {
  const canvas = document.createElement('canvas');
  const ctx    = canvas.getContext('2d', { willReadFrequently: true });
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;

  setInterval(() => {
    frames++;
    fcEl.textContent = `Frame: ${frames}`;
    if (video.readyState < 4) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img  = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
    if (code && code.data) showResult(code.data);
  }, 150);
}

// ── Ergebnis anzeigen ───────────────────────────────────────────
function showResult(raw) {
  rawEl.textContent   = raw;
  tidEl.textContent   = extractTrackId(raw) || '– (kein HITTY-Format erkannt)';
  status.textContent  = '✅ QR-Code erkannt!';
}

function extractTrackId(raw) {
  const m1 = raw.match(/[?&]t=([A-Za-z0-9]+)/);
  if (m1) return m1[1];
  const m2 = raw.match(/spotify:track:([A-Za-z0-9]+)/);
  if (m2) return m2[1];
  if (/^[A-Za-z0-9]{22}$/.test(raw.trim())) return raw.trim();
  return null;
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload  = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
}
</script>
</body>
</html>
