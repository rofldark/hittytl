<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>HITTY Scantest</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    canvas { position: fixed; top: -9999px; left: -9999px; }
    #overlay {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 30%, transparent);
    }
    #result {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-all;
      margin-bottom: 16px;
      min-height: 80px;
    }
    #result .label { color: rgba(255,255,255,0.4); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    #result .value { color: #39FF14; font-weight: bold; }
    #result .track { color: #00E5FF; }
    #status { color: rgba(255,255,255,0.4); font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <div id="status">Kamera startet…</div>
    <div id="result">
      <div class="label">Scan-Ergebnis</div>
      <div class="value" id="raw">–</div>
      <div class="label" style="margin-top:10px">Track-ID erkannt</div>
      <div class="track" id="trackid">–</div>
    </div>
  </div>

<script>
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d', { willReadFrequently: true });
const status = document.getElementById('status');
const rawEl  = document.getElementById('raw');
const tidEl  = document.getElementById('trackid');

let sized = false;
let frames = 0;

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
  .then(stream => {
    video.srcObject = stream;
    video.play();
    setInterval(scan, 150);
  })
  .catch(e => { status.textContent = 'Kamera-Fehler: ' + e.message; });

function scan() {
  if (video.readyState < 4 || !video.videoWidth) {
    frames++;
    status.textContent = `Warte auf Kamera… (${frames})`;
    return;
  }
  if (!sized) {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    sized = true;
    status.textContent = `Kamera aktiv: ${video.videoWidth}×${video.videoHeight}`;
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const img  = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });

  if (code && code.data) {
    rawEl.textContent  = code.data;
    tidEl.textContent  = extractTrackId(code.data) || '– (kein HITTY-Format)';
    status.textContent = '✅ QR erkannt!';
  } else {
    frames++;
    if (frames % 10 === 0) status.textContent = `Suche… Frame ${frames} · ${canvas.width}×${canvas.height}`;
  }
}

function extractTrackId(raw) {
  const m1 = raw.match(/[?&]t=([A-Za-z0-9]+)/);
  if (m1) return m1[1];
  const m2 = raw.match(/spotify:track:([A-Za-z0-9]+)/);
  if (m2) return m2[1];
  if (/^[A-Za-z0-9]{22}$/.test(raw.trim())) return raw.trim();
  return null;
}
</script>
</body>
</html>
